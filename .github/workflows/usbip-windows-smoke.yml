name: USB/IP Windows device smoke test

on:
  workflow_dispatch:

jobs:
  enumerate:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust USB/IP probe
        run: cargo build --release --locked
      - name: Install pinned upstream USBip and attach probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/vadimgrn/usbip-win2/releases/download/v.0.9.8.1/USBip-0.9.8.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile USBip-0.9.8.1-x64.exe
          $expected = '38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a'
          $actual = (Get-FileHash -Algorithm SHA256 USBip-0.9.8.1-x64.exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'USBip release checksum mismatch' }
          $installer = Start-Process -FilePath .\USBip-0.9.8.1-x64.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS=main,client' -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 3010)) { throw "USBip installer returned $($installer.ExitCode)" }
          $usbip = Join-Path ${env:ProgramFiles} 'USBip\usbip.exe'
          if (-not (Test-Path $usbip)) { throw 'USBip client was not installed' }
          $probe = Start-Process -FilePath .\target\release\win-airplay.exe -ArgumentList 'usbip-probe','--seconds','90' -PassThru
          try {
            Start-Sleep -Seconds 3
            $port = (& $usbip --tcp-port 3240 attach --remote 127.0.0.1 --bus-id 1-0123456789abcdef --once --terse | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $port -notmatch '^\d+$') { throw 'USBip failed to attach the virtual audio device' }
            try {
              $found = $false
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                $devices = @(Get-PnpDevice -PresentOnly | Where-Object { $_.FriendlyName -like '*Win AirPlay USB Probe*' })
                if ($devices.Count -gt 0) { $found = $true; $devices | Format-Table -AutoSize; break }
                Start-Sleep -Seconds 1
              }
              if (-not $found) { throw 'Windows did not enumerate the USB audio device' }
            } finally {
              & $usbip detach --port $port
            }
          } finally {
            Stop-Process -Id $probe.Id -ErrorAction SilentlyContinue
          }
