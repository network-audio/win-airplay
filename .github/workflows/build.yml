name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: linux }
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Windows'
        run: cargo test --manifest-path vendor/nyx-refrain/Cargo.toml -p raop --lib
      - run: cargo build --release --locked
      - if: runner.os == 'Windows'
        name: Check bounded log rotation
        shell: pwsh
        run: |
          . ./packaging/windows/rotating-log.ps1
          $directory = Join-Path $env:RUNNER_TEMP 'win-airplay-log-test'
          New-Item -ItemType Directory -Force $directory | Out-Null
          $log = Join-Path $directory 'controller.log'
          for ($i = 0; $i -lt 180; $i++) {
            Write-RotatingLog -Path $log -Message ('x' * 8192)
          }
          Write-RotatingLog -Path $log -Message ''
          if (-not (Test-Path "$log.1")) { throw 'Log did not rotate' }
          [System.IO.File]::WriteAllBytes($log, [byte[]]::new(2MB))
          Write-RotatingLog -Path $log -Message ('y' * 1200000)
          $files = @(Get-ChildItem $directory -File)
          if ($files.Count -gt 2 -or @($files | Where-Object { $_.Length -gt 1MB }).Count -gt 0) {
            throw 'Log rotation exceeded two files or 1 MiB per file'
          }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: win-airplay-controller-${{ matrix.arch }}
          path: target/release/win-airplay.exe

  installer:
    needs: rust
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: win-airplay-controller-${{ matrix.arch }}
          path: staging
      - name: Stage pinned upstream USBip and compile installer
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $url = "https://github.com/vadimgrn/usbip-win2/releases/download/v.0.9.8.1/USBip-0.9.8.1-$arch.exe"
          $upstream = "staging/USBip-0.9.8.1-$arch.exe"
          Invoke-WebRequest -Uri $url -OutFile $upstream
          $expected = if ($arch -eq 'x64') { '38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a' } else { 'cab7ff97f79275eeb5c5b8bb2eb3111ff6b6c4eead07d9bec9be5bd1e3a35800' }
          $actual = (Get-FileHash -Algorithm SHA256 $upstream).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "USBip release checksum mismatch: $actual" }
          Copy-Item vendor/nyx-refrain/LICENSE staging/NYX-LICENSE.txt
          Copy-Item packaging/windows/USBIP-LICENSE.txt staging/
          Copy-Item packaging/windows/install-usbip.ps1 staging/
          Copy-Item packaging/windows/find-usbip.ps1 staging/
          Copy-Item packaging/windows/run-usbip.ps1 staging/
          Copy-Item packaging/windows/rotating-log.ps1 staging/
          Copy-Item packaging/windows/test-playback.ps1 staging/
          Copy-Item packaging/windows/assets/test-tone.wav staging/
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          & $nsis "/DDIST_DIR=$((Resolve-Path staging).Path)" "/DUSBIP_ARCH=$arch" "/DOUT_FILE=win-airplay-windows-$arch-setup.exe" packaging/windows/installer-usbip.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: matrix.arch == 'x64'
        name: Install bundled package and verify USBip path
        shell: pwsh
        run: |
          $setup = (Resolve-Path packaging/windows/win-airplay-windows-x64-setup.exe).Path
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          Write-Host "Runner token has administrator permission: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          $result = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $result.WaitForExit(180000)) {
            Stop-Process -Id $result.Id -Force -ErrorAction SilentlyContinue
            throw 'Silent Win AirPlay installer did not exit within three minutes'
          }
          if ($result.ExitCode -ne 0) {
            $setupLog = Join-Path $env:TEMP 'win-airplay-usbip-setup.log'
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 80 }
            throw "Win AirPlay installer exited with $($result.ExitCode)"
          }
          $folder = Join-Path ${env:ProgramFiles} 'Win AirPlay USBIP'
          $pathFile = Join-Path $folder 'usbip-path.txt'
          if (-not (Test-Path $pathFile)) { throw 'Installer did not save the USBip executable path' }
          $usbip = [System.IO.File]::ReadAllText($pathFile).Trim()
          if (-not (Test-Path -LiteralPath $usbip -PathType Leaf)) { throw "USBip executable is missing: $usbip" }
          $task = Get-ScheduledTask -TaskName 'Win AirPlay USBIP'
          if ($task.Actions.Arguments -notmatch '-WindowStyle Hidden') { throw 'Controller task is not hidden' }
          $ps32 = Join-Path $env:WINDIR 'SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
          $finder = (Resolve-Path packaging/windows/find-usbip.ps1).Path.Replace("'", "''")
          $found32 = & $ps32 -NoProfile -ExecutionPolicy Bypass -Command ". '$finder'; Find-UsbipExecutable"
          if ($found32 -ne $usbip) { throw "32-bit PowerShell found '$found32' instead of '$usbip'" }
          Write-Host "Bundled installer found USBip at $usbip"
      - uses: actions/upload-artifact@v4
        with:
          name: win-airplay-installer-${{ matrix.arch }}
          path: packaging/windows/win-airplay-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  installer-arm64-smoke:
    needs: installer
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-airplay-installer-arm64
          path: installer
      - name: Install bundled ARM64 package and verify USBip path
        shell: pwsh
        run: |
          $setup = (Resolve-Path installer/win-airplay-windows-arm64-setup.exe).Path
          $result = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $result.WaitForExit(180000)) {
            Stop-Process -Id $result.Id -Force -ErrorAction SilentlyContinue
            throw 'Silent ARM64 installer did not exit within three minutes'
          }
          if ($result.ExitCode -ne 0) {
            $setupLog = Join-Path $env:TEMP 'win-airplay-usbip-setup.log'
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 80 }
            throw "ARM64 installer exited with $($result.ExitCode)"
          }
          $folder = Join-Path ${env:ProgramFiles} 'Win AirPlay USBIP'
          $pathFile = Join-Path $folder 'usbip-path.txt'
          if (-not (Test-Path $pathFile)) { throw 'Installer did not save the USBip executable path' }
          $usbip = [System.IO.File]::ReadAllText($pathFile).Trim()
          if (-not (Test-Path -LiteralPath $usbip -PathType Leaf)) { throw "USBip executable is missing: $usbip" }
          $task = Get-ScheduledTask -TaskName 'Win AirPlay USBIP'
          if ($task.Actions.Arguments -notmatch '-WindowStyle Hidden') { throw 'Controller task is not hidden' }
          Write-Host "Bundled ARM64 installer found USBip at $usbip"

  usbip-windows-smoke:
    if: github.ref_name == 'main' || github.ref_name == 'codex/usbip-win2-investigation'
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: win-airplay-controller-${{ matrix.arch }}
          path: probe
      - name: Install USBip and check virtual speaker enumeration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          $url = "https://github.com/vadimgrn/usbip-win2/releases/download/v.0.9.8.1/USBip-0.9.8.1-$arch.exe"
          $upstream = "USBip-0.9.8.1-$arch.exe"
          Invoke-WebRequest -Uri $url -OutFile $upstream
          $expected = if ($arch -eq 'x64') { '38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a' } else { 'cab7ff97f79275eeb5c5b8bb2eb3111ff6b6c4eead07d9bec9be5bd1e3a35800' }
          $actual = (Get-FileHash -Algorithm SHA256 $upstream).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'USBip release checksum mismatch' }
          $customDir = Join-Path $env:RUNNER_TEMP 'USBip custom location'
          $installer = Start-Process -FilePath ".\$upstream" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/COMPONENTS=main,client',"/DIR=`"$customDir`"" -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 3010)) { throw "USBip installer returned $($installer.ExitCode)" }
          . ./packaging/windows/find-usbip.ps1
          $usbip = Find-UsbipExecutable
          if (-not $usbip -or $usbip -ne (Join-Path $customDir 'usbip.exe')) { throw "USBip client was not found at its custom install location: $usbip" }
          $probe = Start-Process -FilePath .\probe\win-airplay.exe -ArgumentList 'usbip-probe','--seconds','55','--expect-pcm','--two-speakers' -RedirectStandardOutput probe-out.log -RedirectStandardError probe-err.log -PassThru
          try {
            Start-Sleep -Seconds 3
            $port = (& $usbip --tcp-port 3240 attach --remote 127.0.0.1 --bus-id 1-0123456789abcdef --once --terse | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $port -notmatch '^\d+$') { throw 'USBip failed to attach the virtual audio device' }
            $port2 = (& $usbip --tcp-port 3240 attach --remote 127.0.0.1 --bus-id 1-fedcba9876543210 --once --terse | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $port2 -notmatch '^\d+$') { throw 'USBip failed to attach the second virtual audio device' }
            try {
              $found = $false
              for ($attempt = 0; $attempt -lt 30; $attempt++) {
                $devices = @(Get-PnpDevice -PresentOnly | Where-Object { $_.FriendlyName -like 'Speakers (Win AirPlay USB Probe*)' })
                if ($devices.Count -eq 2) { $found = $true; $devices | Format-Table -AutoSize; break }
                Start-Sleep -Seconds 1
              }
              if (-not $found) { throw "Windows did not enumerate both USB audio outputs; found $($devices.Count)" }
              & $usbip port
              $before = Get-Process -Id $probe.Id
              $threadsBefore = @{}
              foreach ($thread in $before.Threads) { $threadsBefore[$thread.Id] = $thread.TotalProcessorTime.TotalMilliseconds }
              $cpuBefore = $before.TotalProcessorTime.TotalMilliseconds
              Start-Sleep -Seconds 8
              $after = Get-Process -Id $probe.Id
              $cpuMs = $after.TotalProcessorTime.TotalMilliseconds - $cpuBefore
              $oneCorePercent = 100 * $cpuMs / 8000
              Write-Host "Idle USB/IP probe CPU: $([math]::Round($oneCorePercent, 1))% of one core over 8 seconds"
              foreach ($thread in $after.Threads) {
                $previous = if ($threadsBefore.ContainsKey($thread.Id)) { $threadsBefore[$thread.Id] } else { 0 }
                $delta = $thread.TotalProcessorTime.TotalMilliseconds - $previous
                if ($delta -ge 50) { Write-Host "Thread $($thread.Id) idle CPU: $([math]::Round($delta)) ms" }
              }
              if ($oneCorePercent -ge 10) { throw "Idle USB/IP server used $([math]::Round($oneCorePercent, 1))% of one core" }
              Start-Sleep -Seconds 2
              & .\probe\win-airplay.exe usbip-render-test --endpoint 'Win AirPlay USB Probe'
              if ($LASTEXITCODE -ne 0) { throw 'WASAPI render to virtual USB output failed' }
              & .\probe\win-airplay.exe usbip-render-test --endpoint 'Win AirPlay USB Probe Two'
              if ($LASTEXITCODE -ne 0) { throw 'WASAPI render to second virtual USB output failed' }
              & .\probe\win-airplay.exe usbip-controls-test --endpoint 'Win AirPlay USB Probe'
              if ($LASTEXITCODE -ne 0) { throw 'Windows endpoint volume or mute test failed' }
              if (-not $probe.WaitForExit(65000)) { throw 'USB/IP probe did not finish' }
              if ($probe.ExitCode -ne 0) { throw "USB/IP probe received no PCM (exit $($probe.ExitCode))" }
              if (Select-String -Path probe-err.log -Pattern 'USB/IP URB failed: ep=1' -Quiet) {
                throw 'Windows audio transfer failed on USB endpoint 1'
              }
            } finally {
              & $usbip port
              Start-Process -FilePath $usbip -ArgumentList 'detach','--port',$port -Wait -PassThru | Out-Null
              Start-Process -FilePath $usbip -ArgumentList 'detach','--port',$port2 -Wait -PassThru | Out-Null
              $removed = $false
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                $remaining = @(Get-PnpDevice -PresentOnly | Where-Object { $_.FriendlyName -like 'Speakers (Win AirPlay USB Probe*)' })
                if ($remaining.Count -eq 0) { $removed = $true; break }
                Start-Sleep -Seconds 1
              }
              if (-not $removed) { throw "USB audio outputs remained after detach: $($remaining.Count)" }
            }
          } finally {
            Stop-Process -Id $probe.Id -ErrorAction SilentlyContinue
            if (Test-Path probe-out.log) { Get-Content probe-out.log }
            if (Test-Path probe-err.log) { Get-Content probe-err.log }
          }

