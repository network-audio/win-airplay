[package]
name = "win-airplay"
version = "1.2.4"
edition = "2021"
license = "MIT"
description = "AirPlay 2 discovery and Windows audio sender controller"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
mdns-sd = "0.11"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
usbip-audio = { git = "https://github.com/network-audio/usbip-audio", rev = "9df5f91e0622dbe894b28a425e39364bbe5ee1ad" }

[target.'cfg(windows)'.dependencies]
capture = { path = "vendor/nyx-refrain/crates/capture" }
if-addrs = "0.13"
log = "0.4"
openairplay2 = { path = "vendor/openairplay2" }
pipeline = { path = "vendor/nyx-refrain/crates/pipeline" }
raop = { path = "vendor/nyx-refrain/crates/raop" }
tokio = { version = "1.43", features = ["rt-multi-thread", "time", "sync"] }
windows = { version = "0.58", features = ["Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem"] }

[dev-dependencies]

